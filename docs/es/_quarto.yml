  navbar:
    background: '#123d46'
    foreground: '#ffffff'
    pinned: true
    search: true
    left:
    - href: index.qmd
      text: Resumen
    - href: introduction.qmd
      text: Introducción
    - href: methods.qmd
      text: Métodos
    - text: Resultados
      menu:
      - href: results.qmd
        text: Hipotálamo · PM2.5
      - href: cortex.qmd
        text: Corteza cingulada · PM2.5
      - href: mirna.qmd
        text: miRNA del hipocampo · PM2.5
      - href: ozone.qmd
        text: Hipocampo · ozono
      - href: enrichment.qmd
        text: Enriquecimiento funcional
      - href: advanced_results.qmd
        text: Interacciones y paneles moleculares
      - href: replication.qmd
        text: Reproducción de los artículos
      - href: spatial_reference.qmd
        text: Referencia espacial medida
    - href: gene_profiles.qmd
      text: Genes y funciones
    - text: Atlas espacial
