  site-url: https://amarusimonaguerojimenez.github.io/Air-Pollution-Brain-Omics-Mouse/es/
  repo-url: https://github.com/AmaruSimonAgueroJimenez/Air-Pollution-Brain-Omics-Mouse
format:
  html:
    theme: cosmo
    css: ../assets/report.css
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: true
    code-copy: true
    link-external-newwindow: true
    fig-format: png
    fig-dpi: 180
    smooth-scroll: true
    mainfont: system-ui
    fontsize: 1rem
    grid:
      body-width: 1020px
      margin-width: 230px
lang: es
language:
  title-block-published: Fecha del análisis
date: '2026-10-20'
date-format: D MMMM YYYY
bibliography: ../references.bib
link-citations: true
jupyter: omics-analysis
execute:
  echo: false
  warning: false
  message: false
  error: false
  cache: false
  freeze: false
